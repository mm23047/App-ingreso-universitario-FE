<!-- ============================================================
     VISTA: INSCRIPCIÓN EN PRUEBA  (#/inscripcion)
     Fragmento inyectado por el router en <main id="app-content">.
     Controller: InscripcionesController
     DAO:        InscripcionesDao  →  POST /aspirantes/{id}/inscripciones
     Body:       { pruebaAdmision: { idPruebaAdmision: UUID } }
     Nota:       El pruebaAdmisionId debe obtenerse del sistema (prueba activa).
     ============================================================ -->

<div class="card container-md">
    <div class="card-header">
        <h2>Confirmación de Inscripción</h2>
        <p class="text-muted">Revisa tus datos antes de inscribirte en la prueba de admisión.</p>
    </div>

    <section id="resumen-datos" class="grid-resultados mb-lg">
        <span class="text-muted">Aspirante</span>   <strong id="dato-nombre">—</strong>
        <span class="text-muted">DUI</span>          <strong id="dato-dui">—</strong>
        <span class="text-muted">Correo</span>       <strong id="dato-correo">—</strong>
        <span class="text-muted">Carrera</span>      <strong id="dato-carrera">—</strong>
    </section>

    <div id="estado-inscripcion" class="hidden text-center mb-md">
        <p class="text-success">✅ Inscripción registrada exitosamente.</p>
        <p class="text-muted" id="dato-inscripcion-id" style="font-size:.85rem;"></p>
    </div>

    <div style="display: flex; gap: var(--space-md); justify-content: flex-end;">
        <a href="#/carreras" class="btn btn-outline">← Cambiar carrera</a>
        <button id="btn-inscribir" class="btn btn-primary">Inscribirme</button>
        <button id="btn-continuar-examen" class="btn btn-secondary hidden">Ir al examen →</button>
    </div>
</div>

<script type="module">
    import InscripcionesController from '../../control/inscripciones_controller.js';
    import { navigate } from '../../infra/router.js';
    import { store } from '../../infra/app_state.js';

    const controller = new InscripcionesController();

    const aspirante = store.aspirante;
    const carrera   = store.carreraSeleccionada;

    document.getElementById('dato-nombre').textContent  =
        aspirante ? `${aspirante.nombres} ${aspirante.apellidos}` : '—';
    document.getElementById('dato-dui').textContent     = aspirante?.dui    ?? '—';
    document.getElementById('dato-correo').textContent  = aspirante?.correo ?? '—';
    document.getElementById('dato-carrera').textContent =
        carrera ? carrera.nombreCatalogoCarrera : '—';

    document.getElementById('btn-inscribir').addEventListener('click', async () => {
        // TODO: obtener el pruebaAdmisionId de la prueba activa del sistema.
        // Por ahora se debe pasar como parámetro desde la configuración o un DAO de PruebasAdmision.
        const pruebaAdmisionId = null; // reemplazar con UUID real de la prueba activa
        try {
            const inscripcion = await controller.inscribir(pruebaAdmisionId);
            document.getElementById('dato-inscripcion-id').textContent =
                `ID inscripción: ${inscripcion.id}`;
            document.getElementById('estado-inscripcion').classList.remove('hidden');
            document.getElementById('btn-inscribir').classList.add('hidden');
            document.getElementById('btn-continuar-examen').classList.remove('hidden');
        } catch (_) {
            // El controller ya muestra el toast de error
        }
    });

    document.getElementById('btn-continuar-examen').addEventListener('click', () => navigate('/examen'));
</script>
