<!-- ============================================================
     VISTA: RESULTADO / ESTADO DE PRUEBA  (#/resultado)
     Fragmento inyectado por el router en <main id="app-content">.
     Controller: ExamenController  →  GET /examen_realizado/aspirante/{idAspirante}
     Campos BE:  idExamenRealizado, inscripcionesPrueba, claveExamen,
                 etapaAdmision, puntajeFinal (null=pendiente), fechaRealizacion

     Flujo:
       1. Si store.aspirante.id existe → auto-consulta al cargar la página
       2. Si no → el usuario ingresa DUI, correo o UUID de aspirante manualmente
     ============================================================ -->
<style>
.alerta-datos {
    background: #fef3c7;
    border-left: 4px solid #d97706;
    color: #92400e;
    padding: 0.65rem 1rem;
    border-radius: 4px;
    margin-bottom: 0.75rem;
    font-size: 0.9rem;
}
</style>

<h2 class="mb-md">Resultado de tu prueba</h2>
<p class="text-muted mb-lg">
    Consulta la fecha, estado y puntaje de tu prueba de admisión.
</p>

<div class="consulta-wrap card mb-lg" id="panel-busqueda">
    <div class="card-header">
        <h3>Consultar resultados de admisión</h3>
        <p class="text-muted card-subtitle">
            Ingresa tu DUI, Correo electrónico o ID de aspirante.
            Si acabas de registrarte en esta sesión, tus resultados se cargarán automáticamente.
        </p>
    </div>
    <div class="busqueda-row">
        <div class="form-group">
            <label for="input-id" style="font-weight:500;">DUI, Correo o ID de aspirante</label>
            <input type="text" id="input-id" class="input-id"
                   placeholder="Ej: 00000000-0 o ejemplo@correo.com">
        </div>
        <button id="btn-buscar" class="btn btn-primary">
            Consultar
        </button>
    </div>
</div>

<div id="msg-estado" class="consulta-wrap text-center msg-estado hidden"></div>

<div id="lista-resultados" class="consulta-wrap"></div>

<script type="module">
    import ExamenController from './js/control/examen_controller.js';
    import { store } from './js/infra/app_state.js';
    import './js/boundary/components/recom-box.js';

    const ctrl        = new ExamenController();
    const inputId     = document.getElementById('input-id');
    const btnBuscar   = document.getElementById('btn-buscar');
    const msgEstado   = document.getElementById('msg-estado');
    const listaEl     = document.getElementById('lista-resultados');

    const mostrarMensaje = (html) => {
        listaEl.innerHTML = '';
        msgEstado.innerHTML = html;
        msgEstado.classList.remove('hidden');
    };

    /* ── Construye el elemento <app-recom-box> con los datos del examen ── */
    function crearRecomBox(examen) {
        let estadoClave = examen.estadoAdmision;
        if (!estadoClave && examen.inscripcionesPrueba?.estado) {
            estadoClave = examen.inscripcionesPrueba.estado;
        }
        if (!estadoClave) return null;

        const recom = document.createElement('app-recom-box');
        recom.data = { tipo: estadoClave };
        return recom;
    }

    /* ── Tarjeta de examen realizado → retorna elemento DOM ── */
    function renderExamen(ex) {
        const calificado        = ex.puntajeFinal != null;
        const estadoInscripcion = ex.inscripcionesPrueba?.estado ?? '—';

        const badgeCalificacion = calificado
            ? '<span class="badge badge-success">Calificado</span>'
            : '<span class="badge badge-warning">Pendiente de calificación</span>';

        let badgeAdmision = '';
        if      (ex.estadoAdmision === 'ADMITIDO')    badgeAdmision = '<span class="badge badge-info">Admitido</span>';
        else if (ex.estadoAdmision === 'NO_ADMITIDO') badgeAdmision = '<span class="badge badge-danger">No admitido</span>';
        else if (ex.estadoAdmision === 'PENDIENTE')   badgeAdmision = '<span class="badge badge-neutral">Pendiente de admisión</span>';

        const fecha = ex.fechaRealizacion
            ? new Date(ex.fechaRealizacion).toLocaleString('es-SV', {
                day:'2-digit', month:'long', year:'numeric',
                hour:'2-digit', minute:'2-digit'
              })
            : '—';

        const pruebaNombre = ex.claveExamen?.pruebaAdmision?.nombrePrueba
            ?? ex.inscripcionesPrueba?.pruebaAdmision?.nombrePrueba
            ?? 'Prueba de admisión';

        const aspirante  = ex.inscripcionesPrueba?.aspiranteDato;
        const nombreAsp  = aspirante
            ? `${aspirante.nombres ?? ''} ${aspirante.apellidos ?? ''}`.trim()
            : '—';

        const card = document.createElement('div');
        card.className = 'card mb-md';

        /* Alerta de inconsistencia de datos (condicional) */
        if (calificado && estadoInscripcion === 'INSCRITO') {
            const alerta = document.createElement('div');
            alerta.className = 'alerta-datos';
            alerta.setAttribute('role', 'alert');
            alerta.textContent =
                'El puntaje está registrado pero el estado de tu inscripción no se actualizó correctamente. ' +
                'Comunícate con la Oficina de Admisiones para verificar tu expediente.';
            card.appendChild(alerta);
        }

        /* Cabecera de la tarjeta */
        const header = document.createElement('div');
        header.className = 'examen-header';
        header.innerHTML = `
            <h3>${pruebaNombre}</h3>
            <div class="badges-row">${badgeCalificacion}${badgeAdmision}</div>`;
        card.appendChild(header);

        /* Panel de puntaje (solo si está calificado) */
        if (calificado) {
            const puntajeDiv = document.createElement('div');
            puntajeDiv.className = 'puntaje-panel';
            puntajeDiv.innerHTML = `
                <p class="puntaje-label">Puntaje obtenido</p>
                <span class="puntaje-num">${ex.puntajeFinal}</span>`;
            card.appendChild(puntajeDiv);
        }

        /* Grid de datos del examen */
        const dl = document.createElement('dl');
        dl.className = 'examen-grid';
        dl.innerHTML = `
            <dt>Aspirante</dt>        <dd>${nombreAsp}</dd>
            <dt>Fecha de realización</dt><dd>${fecha}</dd>
            <dt>Etapa</dt>            <dd>${ex.etapaAdmision?.nombre ?? '—'}</dd>
            <dt>Estado</dt>           <dd>${estadoInscripcion}</dd>
            ${ex.carreraAsignada ? `<dt>Carrera asignada</dt><dd>${ex.carreraAsignada}</dd>` : ''}
            <dt>Clave de examen</dt>  <dd>${ex.claveExamen?.nombreClave ?? '—'}</dd>`;
        card.appendChild(dl);

        /* Recomendaciones — delegadas al componente */
        const recom = crearRecomBox(ex);
        if (recom) card.appendChild(recom);

        return card;
    }

    /* ── Notificación inscrito sin examen → retorna elemento DOM ── */
    function renderInscritoSinExamen(insc) {
        const pruebaNombre = insc.pruebaAdmision?.nombrePrueba ?? 'Prueba de admisión';
        const aspirante    = insc.aspiranteDato;
        const nombreAsp    = aspirante
            ? `${aspirante.nombres ?? ''} ${aspirante.apellidos ?? ''}`.trim()
            : '—';

        const div = document.createElement('div');
        div.className = 'inscrito-notif';
        div.innerHTML = `
            <div class="examen-header">
                <h3>${pruebaNombre}</h3>
                <div class="badges-row">
                    <span class="badge badge-warning">Pendiente de examen</span>
                </div>
            </div>
            <dl class="examen-grid">
                <dt>Aspirante</dt><dd>${nombreAsp}</dd>
                <dt>Estado</dt>   <dd>${insc.estado ?? 'INSCRITO'}</dd>
            </dl>`;

        const recom = document.createElement('app-recom-box');
        recom.data = {
            tipo:      'PENDIENTE',
            titulo:    'Próximos pasos',
            subtitulo: 'Estás inscrito — el examen aún no ha sido realizado',
            pasos: [
                'Verifica la fecha y hora de tu examen en la Oficina de Admisiones.',
                'Ten a mano tu DUI y comprobante de inscripción el día de la prueba.',
                'Llega al aula asignada con al menos 30 minutos de anticipación.',
                'Descansa bien la noche anterior y lleva lapicero negro.',
                'Consulta esta página después del examen para ver tu resultado.'
            ]
        };
        div.appendChild(recom);
        return div;
    }

    /* ── Panel aspirante solo registrado → retorna elemento DOM ── */
    function renderSoloRegistrado(aspirante) {
        const nombreAsp = `${aspirante.nombres ?? ''} ${aspirante.apellidos ?? ''}`.trim() || 'Aspirante';

        const div = document.createElement('div');
        div.className = 'inscrito-notif';
        div.style.borderLeft = '4px solid var(--color-warning)';
        div.innerHTML = `
            <div class="examen-header">
                <h3>¡Registro Encontrado!</h3>
                <div class="badges-row">
                    <span class="badge badge-warning" style="background-color:#fef3c7;color:#d97706;">Sin convocatorias activas</span>
                </div>
            </div>
            <p class="mb-md">
                Hola <strong>${nombreAsp}</strong>, tu cuenta ha sido creada exitosamente en nuestra
                plataforma, pero detectamos que aún no te has inscrito a ninguna prueba de admisión
                para el ciclo actual.
            </p>`;

        const recom = document.createElement('app-recom-box');
        recom.data = {
            tipo:      'PENDIENTE',
            titulo:    '¿Qué debes hacer ahora?',
            subtitulo: 'Sigue estos pasos para activar tu proceso de selección:',
            pasos: [
                'Dirígete al apartado de <strong>Inscripciones</strong> en el menú principal.',
                'Selecciona la carrera a la que deseas aplicar y la convocatoria disponible.',
                'Descarga tu mandamiento de pago (si aplica) y efectúa el pago en las agencias autorizadas.',
                'Una vez procesado tu pago, regresa a esta pestaña para verificar la asignación de tu aula, fecha y clave de examen.'
            ]
        };
        div.appendChild(recom);
        return div;
    }

    /* ── Búsqueda principal ── */
    const buscarResultados = async (criterio) => {
        if (!criterio) {
            mostrarMensaje('Ingresa tu DUI, Correo o ID de aspirante para consultar.');
            return;
        }
        mostrarMensaje('Consultando resultados...');

        try {
            const { tipo, datos } = await ctrl.consultarEstadoAspirante(criterio);
            msgEstado.classList.add('hidden');
            listaEl.innerHTML = '';

            if (tipo === 'examenes') {
                datos.forEach(ex => listaEl.appendChild(renderExamen(ex)));
            } else if (tipo === 'inscripciones') {
                datos.forEach(insc => listaEl.appendChild(renderInscritoSinExamen(insc)));
            } else if (tipo === 'solo_registrado') {
                listaEl.appendChild(renderSoloRegistrado(datos));
            } else {
                mostrarMensaje('No se encontró ningún aspirante registrado con los datos ingresados. Revisa si hay errores de dedo en tu DUI o Correo.');
            }
        } catch (error) {
            const esCaida = error instanceof TypeError && error.message.includes('fetch');
            mostrarMensaje(esCaida
                ? 'Backend no disponible — comprueba que el servidor esté encendido.'
                : `Error al consultar resultados: ${error.message}`
            );
        }
    };

    /* ── Auto-consulta si hay sesión activa ── */
    const aspId = store.aspirante?.id;
    if (aspId) {
        inputId.value = aspId;
        buscarResultados(aspId);
    }

    /* ── Búsqueda manual ── */
    btnBuscar.addEventListener('click', () => {
        const criterio = inputId.value.trim();
        if (!criterio) {
            document.querySelector('app-toast')?.show('Ingresa tu DUI, Correo o ID de aspirante.', 3000, 'warning');
            return;
        }
        buscarResultados(criterio);
    });

    inputId.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') btnBuscar.click();
    });
</script>
