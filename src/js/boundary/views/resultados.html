<!-- ============================================================
     VISTA: RESULTADOS  (#/resultados)
     Fragmento inyectado por el router en <main id="app-content">.
     Controller: ExamenController
     DAO:        ExamenDao  →  GET /examen_realizado/{id}
     Nota:       El puntaje real es calculado por el backend mediante
                 POST /examen_realizado/{id}/calificar (proceso administrativo).
     ============================================================ -->

<div class="card container-md text-center">

    <div style="font-size: 4rem; margin-bottom: var(--space-md);">🎓</div>

    <h2 style="color: var(--color-primary-dark); margin-bottom: var(--space-md);">
        Examen entregado
    </h2>

    <p class="text-muted mb-lg">
        Tu examen fue recibido correctamente. El puntaje será calculado por el sistema
        una vez que el proceso de calificación haya concluido.
    </p>

    <div id="datos-resultado" class="grid-resultados mb-lg" style="max-width:400px; margin-inline:auto;">
        <span class="text-muted">Aspirante</span>  <strong id="res-nombre">—</strong>
        <span class="text-muted">Examen ID</span>  <strong id="res-examen">—</strong>
        <span class="text-muted">Estado</span>     <strong id="res-estado">Entregado</strong>
        <span class="text-muted">Puntaje</span>    <strong id="res-puntaje">Pendiente de calificación</strong>
    </div>

    <div style="display: flex; gap: var(--space-md); justify-content: center; flex-wrap: wrap;">
        <a href="#/" class="btn btn-outline">Volver al inicio</a>
    </div>

</div>

<script type="module">
    import { store } from '../../infra/app_state.js';

    const aspirante = store.aspirante;
    const examen    = store.examenActivo;

    document.getElementById('res-nombre').textContent =
        aspirante ? `${aspirante.nombres} ${aspirante.apellidos}` : '—';
    document.getElementById('res-examen').textContent =
        examen?.id ?? '—';
    document.getElementById('res-puntaje').textContent =
        examen?.puntajeFinal != null ? `${examen.puntajeFinal}` : 'Pendiente de calificación';
</script>
