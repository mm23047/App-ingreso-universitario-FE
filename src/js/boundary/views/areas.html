<!-- ============================================================
     VISTA: ÁREAS DE CONOCIMIENTO  (#/areas)
     Fragmento inyectado por el router en <main id="app-content">.

     Jerarquía real disponible en la API:
       GET /areas?max=100         → AreasConocimiento[]  {idAreaConocimiento, nombreArea}
       GET /areas/{id}/temas      → Tema[]               {idTema, nombreTema, areaConocimiento}

     NOTA: idTemaPadre es @JsonbTransient en el backend → no llega en JSON.
           La única jerarquía disponible es: Area → Temas (plana por área).

     Si store.prueba tiene valor (viene de procesos.html), se muestra el contexto
     del proceso seleccionado. Las áreas son un catálogo global del sistema.
     ============================================================ -->

<style>
    .area-nodo {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        margin-bottom: var(--space-sm);
        overflow: hidden;
    }
    .area-cabecera {
        display: flex; align-items: center; justify-content: space-between;
        padding: var(--space-md) var(--space-lg);
        cursor: pointer;
        user-select: none;
        transition: background var(--transition);
    }
    .area-cabecera:hover { background: #EFF6FF; }
    .area-cabecera.expandida { background: #EFF6FF;
        border-bottom: 1px solid var(--color-border); }
    .area-titulo { font-weight: 600; color: var(--color-primary-dark); }
    .area-icono-toggle {
        font-size: 1.1rem; color: var(--color-primary);
        transition: transform .2s;
    }
    .expandida .area-icono-toggle { transform: rotate(90deg); }
    .area-temas {
        padding: var(--space-md) var(--space-lg);
        display: none;
    }
    .area-nodo.abierta .area-temas { display: block; }
    .tema-item {
        display: flex; align-items: center; gap: var(--space-md);
        padding: var(--space-xs) 0;
        border-bottom: 1px solid #F1F5F9;
        font-size: .93rem;
        color: var(--color-text);
    }
    .tema-item:last-child { border-bottom: none; }
    .tema-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--color-primary-light); flex-shrink: 0;
    }
    .cargando-temas {
        color: var(--color-text-muted); font-size: .9rem; padding: var(--space-sm) 0;
    }
    .sin-temas { color: var(--color-text-muted); font-size: .9rem; font-style: italic; }
    .contexto-proceso {
        background: #EFF6FF; border: 1px solid #BFDBFE;
        border-radius: var(--radius-lg); padding: var(--space-md) var(--space-lg);
        margin-bottom: var(--space-lg); font-size: .93rem;
    }
    .contexto-proceso strong { color: var(--color-primary-dark); }
</style>

<h2 class="mb-md" style="color:var(--color-primary-dark);">Áreas de conocimiento</h2>
<p class="text-muted mb-lg">
    Catálogo de áreas temáticas del sistema. Cada área contiene los temas evaluados en la prueba de admisión.
    Haz clic en un área para expandir sus temas.
</p>

<!-- Contexto del proceso (si viene de procesos.html) -->
<div id="contexto-proceso" class="contexto-proceso hidden"></div>

<!-- Lista de áreas colapsables -->
<div id="lista-areas">
    <p class="text-muted text-center">Cargando áreas de conocimiento...</p>
</div>

<script type="module">
    // Rutas relativas al documento base index.html
    import AreasController from './js/control/areas_controller.js';
    import { store } from './js/infra/app_state.js';

    const ctrl      = new AreasController();
    const listaEl   = document.getElementById('lista-areas');
    const ctxEl     = document.getElementById('contexto-proceso');

    // ── Mostrar contexto de proceso si viene de procesos.html ──
    const prueba = store.prueba;
    if (prueba?.idPruebaAdmision) {
        ctxEl.innerHTML =
            `Mostrando áreas del sistema correspondientes al proceso: ` +
            `<strong>${prueba.nombrePrueba} (${prueba.anio ?? '—'})</strong>`;
        ctxEl.classList.remove('hidden');
    }

    // ── Crear nodo de área con carga lazy de temas ──
    const crearNodoArea = (area) => {
        const nodo = document.createElement('div');
        nodo.className = 'area-nodo';
        nodo.dataset.id = area.idAreaConocimiento;

        nodo.innerHTML = `
            <div class="area-cabecera" role="button" tabindex="0"
                 aria-expanded="false" aria-controls="temas-${area.idAreaConocimiento}">
                <span class="area-titulo">${area.nombreArea}</span>
                <span class="area-icono-toggle" aria-hidden="true">▶</span>
            </div>
            <div class="area-temas" id="temas-${area.idAreaConocimiento}"
                 role="region">
                <p class="cargando-temas">Cargando temas...</p>
            </div>
        `;

        const cabecera  = nodo.querySelector('.area-cabecera');
        const temasDiv  = nodo.querySelector('.area-temas');
        let   cargados  = false;

        const toggleArea = async () => {
            const estaAbierta = nodo.classList.contains('abierta');
            if (estaAbierta) {
                nodo.classList.remove('abierta');
                cabecera.classList.remove('expandida');
                cabecera.setAttribute('aria-expanded', 'false');
                return;
            }

            nodo.classList.add('abierta');
            cabecera.classList.add('expandida');
            cabecera.setAttribute('aria-expanded', 'true');

            if (cargados) return;
            cargados = true;

            try {
                const temas = await ctrl.cargarTemasPorArea(area.idAreaConocimiento);
                if (!temas.length) {
                    temasDiv.innerHTML = '<p class="sin-temas">Esta área no tiene temas registrados.</p>';
                    return;
                }
                temasDiv.innerHTML = temas.map(t =>
                    `<div class="tema-item">
                        <span class="tema-dot"></span>
                        <span>${t.nombreTema}</span>
                    </div>`
                ).join('');
            } catch {
                temasDiv.innerHTML =
                    '<p style="color:var(--color-danger);font-size:.9rem;">Error al cargar temas.</p>';
                cargados = false;
            }
        };

        cabecera.addEventListener('click', toggleArea);
        cabecera.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleArea(); }
        });

        return nodo;
    };

    const renderError = (err) => {
        const esCaida = err instanceof TypeError && err.message.includes('fetch');
        listaEl.innerHTML = esCaida
            ? '<p class="text-danger text-center">⚠ Backend no disponible — comprueba que el servidor esté encendido.</p>'
            : `<p class="text-danger text-center">Error al cargar áreas: ${err.message}</p>`;
    };

    // ── Cargar áreas y construir árbol ──
    ctrl.cargarTodas()
        .then(areas => {
            if (!areas.length) {
                listaEl.innerHTML = '<p class="text-muted text-center">No hay áreas de conocimiento registradas.</p>';
                return;
            }
            listaEl.innerHTML = '';
            const ordenadas = [...areas].sort((a, b) => a.nombreArea.localeCompare(b.nombreArea));
            ordenadas.forEach(area => listaEl.appendChild(crearNodoArea(area)));
        })
        .catch(renderError);
</script>
