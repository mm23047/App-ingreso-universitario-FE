<!-- ============================================================
     VISTA: CARRERAS DISPONIBLES  (#/carreras)
     Fragmento inyectado por el router en <main id="app-content">.
     Controller: CarrerasController
     DAO:        CarrerasDao  →  GET /carreras
     Campos: idCarrera (String), nombreCatalogoCarrera (String)
     Vista informativa: solo muestra el catálogo, sin selección ni flujos.
     ============================================================ -->

<h2 class="mb-md">Carreras disponibles</h2>
<p class="text-muted mb-lg">Estas son las carreras disponibles en el programa de ingreso universitario.</p>

<div id="lista-carreras" class="grid-cards">
    <p class="text-muted text-center">Cargando carreras...</p>
</div>

<script type="module">
    import CarrerasController from './js/control/carreras_controller.js';
    import './js/boundary/components/carrera-card.js';

    const controller = new CarrerasController();
    const lista      = document.getElementById('lista-carreras');

    const renderCarreras = (carreras) => {
        if (!carreras || carreras.length === 0) {
            lista.innerHTML = '<p class="text-muted text-center">No hay carreras disponibles en el backend.</p>';
            return;
        }
        lista.innerHTML = '';
        carreras.forEach(c => {
            const card = document.createElement('app-carrera-card');
            card.setAttribute('id-carrera', c.idCarrera);
            card.setAttribute('nombre',     c.nombreCatalogoCarrera);
            lista.appendChild(card);
        });
    };

    const renderError = (err) => {
        const esCaida = err instanceof TypeError && err.message.includes('fetch');
        lista.innerHTML = esCaida
            ? `<p class="text-danger text-center">Backend no disponible — comprueba que el servidor esté encendido.</p>`
            : `<p class="text-danger text-center">Error al cargar las carreras: ${err.message}</p>`;
    };

    controller.cargarTodas().then(renderCarreras).catch(renderError);
</script>
