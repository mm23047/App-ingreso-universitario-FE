<!-- ============================================================
     VISTA: PROCESOS DE INGRESO  (#/procesos)

     Fuentes de datos — sin modificar backend:
     ┌─────────────────────────────────────────────────────────────┐
     │ 1. GET /v1/pruebas_admision?first=0&max=200                 │
     │    → [{ idPruebaAdmision, nombrePrueba, anio, activa }]     │
     │                                                             │
     │ 2. GET /v1/turnos                                           │
     │    → [{ idTurnoExamen, nombreTurno, fecha,                  │
     │         horaInicio, horaFin,                                │
     │         pruebaAdmision: { idPruebaAdmision } }]             │
     │                                                             │
     │ 3. GET /v1/aulas_turnos/disponibilidad                      │
     │    → [{ idDisponibilidadAulaTurno: { idAula, idTurno },     │
     │         aula: { codigoAulaApi, ... },                       │
     │         turnoExamen: { idTurnoExamen, ... } }]              │
     └─────────────────────────────────────────────────────────────┘

     Join cliente:
       prueba → turnos  (por turno.pruebaAdmision.idPruebaAdmision)
       turno  → sedes   (por disponibilidad.turnoExamen.idTurnoExamen)

     Objeto ensamblado final:
     {
       idPruebaAdmision, nombrePrueba, anio, activa,
       fechaInicio: string|null,   // min(turno.fecha)
       fechaFin:    string|null,   // max(turno.fecha)
       jornadas:    string[],      // nombreTurno únicos
       horarios:    string[],      // "HH:MM – HH:MM" únicos
       sedes:       string[]       // codigoAulaApi únicos
     }

     Campos sin endpoint disponible (ocultos):
       - Tipo de prueba     (no existe en ninguno de los 3 endpoints)
       - Descripción        (PruebaAdmision no tiene campo descripción)
       - Cupos disponibles  (requiere GET /cupos — fuera de alcance)
     ============================================================ -->

<style>

</style>

<!-- ── Encabezado ── -->
<h2 class="mb-xs" style="color:var(--color-primary-dark);">Procesos de ingreso</h2>

<!-- ── Banner de datos parciales ── -->
<div id="ps-banner" class="ps-banner-parcial" role="status"></div>

<!-- ── Barra de búsqueda + contador ── -->
<div style="display:flex; align-items:center; gap:var(--space-md); flex-wrap:wrap; margin-bottom:var(--space-lg);">
    <div class="ps-buscador-wrap">
        <span class="ps-buscador-icon" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.35-4.35"/>
            </svg>
        </span>
        <input type="search" id="ps-buscador" class="ps-buscador"
               placeholder="Buscar por nombre del proceso…"
               autocomplete="off" aria-label="Buscar proceso">
    </div>
    <span id="ps-contador" class="ps-contador" aria-live="polite"></span>
</div>

<!-- ── Filtros por año (se genera dinámicamente) ── -->
<div id="ps-filtros-anio" style="display:none;"></div>

<!-- ── Timeline cronológica (se genera dinámicamente) ── -->
<div id="ps-grid"></div>

<script type="module">
    import DefaultDao   from './js/control/default_dao.js';
    import { store }    from './js/infra/app_state.js';
    import { navigate } from './js/infra/router.js';
    import './js/boundary/components/proceso-card.js';

    const BASE     = new DefaultDao().getBaseUrl();
    const grid     = document.getElementById('ps-grid');
    const buscador = document.getElementById('ps-buscador');

    grid.addEventListener('proceso-seleccionado', (e) => {
        const p = e.detail.proceso;
        store.prueba = {
            idPruebaAdmision: p.idPruebaAdmision,
            nombrePrueba:     p.nombrePrueba,
            anio:             p.anio,
            activa:           p.activa,
        };
        navigate('/areas');
    });
    const contador = document.getElementById('ps-contador');
    const banner   = document.getElementById('ps-banner');

    let _todos        = [];   // cache completo de procesos ensamblados (carga inicial)
    let _anioActivo   = null; // null = mostrar todos los años
    let _turnosBrutos    = [];   // turnos crudos para reensamblaje tras búsqueda backend
    let _dispsBrutos     = [];   // disponibilidades crudas para reensamblaje
    let _abortController = null; // cancela peticiones en vuelo al llegar una nueva

    /* ══════════════════════════════════════════════════
       CARGA — 3 endpoints en paralelo con degradación
    ══════════════════════════════════════════════════ */
    async function cargarDatos() {
        mostrarSkeleton();

        const [resPruebas, resTurnos, resDisp] = await Promise.allSettled([
            fetch(`${BASE}pruebas_admision?first=0&max=200`)
                .then(r => r.ok ? r.json() : Promise.reject(`HTTP ${r.status}`)),
            fetch(`${BASE}turnos`)
                .then(r => r.ok ? r.json() : Promise.reject(`HTTP ${r.status}`)),
            fetch(`${BASE}aulas_turnos/disponibilidad`)
                .then(r => r.ok ? r.json() : Promise.reject(`HTTP ${r.status}`)),
        ]);

        // Procesos es obligatorio — sin él no hay nada que mostrar
        if (resPruebas.status === 'rejected') {
            mostrarError('No se pudieron cargar los procesos. Verifica que el servidor esté encendido en el puerto 9080.');
            return;
        }

        // Turnos y disponibilidad son enriquecimiento — degradan con aviso
        const avisos = [];
        if (resTurnos.status === 'rejected') avisos.push('fechas y horarios (turnos no disponibles)');
        if (resDisp.status   === 'rejected') avisos.push('sedes (disponibilidad de aulas no disponible)');
        if (avisos.length) {
            banner.style.display = 'block';
            banner.textContent = `⚠ Datos incompletos: no se pudieron cargar ${avisos.join(' y ')}.`;
        }

        const pruebas = resPruebas.value ?? [];
        const turnos  = resTurnos.status === 'fulfilled' ? (resTurnos.value ?? []) : [];
        const disps   = resDisp.status   === 'fulfilled' ? (resDisp.value   ?? []) : [];

        _turnosBrutos = turnos;
        _dispsBrutos  = disps;
        _todos = ensamblar(pruebas, turnos, disps);
        generarFiltrosAnio(_todos);
        renderizar(_todos);
    }

    /* ══════════════════════════════════════════════════
       ENSAMBLAJE — join cliente por IDs
    ══════════════════════════════════════════════════ */
    function ensamblar(pruebas, turnos, disps) {
        // Índice: idPruebaAdmision → turnos[]
        const turnosPorPrueba = {};
        for (const t of turnos) {
            const pid = t.pruebaAdmision?.idPruebaAdmision;
            if (pid) (turnosPorPrueba[pid] ??= []).push(t);
        }

        // Índice: idTurnoExamen → Set<codigoAulaApi>
        const sedesPorTurno = {};
        for (const d of disps) {
            const tid  = d.turnoExamen?.idTurnoExamen
                      ?? d.idDisponibilidadAulaTurno?.idTurno;
            const sede = d.aula?.codigoAulaApi;
            if (tid && sede) (sedesPorTurno[tid] ??= new Set()).add(sede);
        }

        return pruebas.map(p => {
            const turnosP = turnosPorPrueba[p.idPruebaAdmision] ?? [];

            // Fechas ordenadas → inicio = primera, fin = última
            const fechas = turnosP.map(t => t.fecha).filter(Boolean).sort();

            // Jornadas únicas (nombreTurno)
            const jornadas = [...new Set(turnosP.map(t => t.nombreTurno).filter(Boolean))];

            // Horarios únicos "HH:MM – HH:MM"
            const horarios = [...new Set(
                turnosP
                    .filter(t => t.horaInicio && t.horaFin)
                    .map(t => `${t.horaInicio.slice(0,5)} – ${t.horaFin.slice(0,5)}`)
            )];

            // Sedes únicas de todos los turnos de este proceso
            const sedes = new Set();
            turnosP.forEach(t =>
                (sedesPorTurno[t.idTurnoExamen] ?? new Set()).forEach(s => sedes.add(s))
            );

            return {
                idPruebaAdmision: p.idPruebaAdmision,
                nombrePrueba:     p.nombrePrueba ?? '—',
                anio:             p.anio         ?? '—',
                activa:           !!p.activa,
                fechaInicio:      fechas[0]              ?? null,
                fechaFin:         fechas.at(-1)          ?? null,
                jornadas,
                horarios,
                sedes: [...sedes],
            };
        });
    }

    /* ══════════════════════════════════════════════════
       RENDER
    ══════════════════════════════════════════════════ */
    function renderizar(lista) {
        actualizarContador(lista.length);

        if (!lista.length) {
            grid.innerHTML = `
                <div class="ps-empty" style="text-align:center; padding:var(--space-2xl);">
                    <div class="ps-empty-icon">📋</div>
                    <p style="font-size:1rem; font-weight:500;">No se encontraron procesos.</p>
                    <p style="font-size:.88rem; margin-top:4px;">
                        Intenta con otro término de búsqueda o cambia el filtro de año.
                    </p>
                </div>`;
            return;
        }

        // Agrupar por año (desc) y construir timeline
        const grupos = agruparPorAnio(lista);

        // Wrapper con línea vertical
        const root = document.createElement('div');
        root.className = 'ps-tl-root';

        const linea = document.createElement('div');
        linea.className = 'ps-tl-linea';
        linea.setAttribute('aria-hidden', 'true');
        root.appendChild(linea);

        for (const [anio, procesos] of grupos) {
            const grupo = document.createElement('div');
            grupo.className = 'ps-tl-grupo';

            // Nodo-año en la línea de tiempo
            const nodo = document.createElement('div');
            nodo.className = 'ps-tl-nodo';
            nodo.setAttribute('aria-hidden', 'true');
            nodo.textContent = anio;

            // Columna de contenido
            const contenido = document.createElement('div');
            contenido.className = 'ps-tl-contenido';

            // Título del grupo (AÑO ACADÉMICO · N procesos)
            const titulo = document.createElement('div');
            titulo.className = 'ps-tl-anio-titulo';
            titulo.textContent = `Año académico ${anio} · ${procesos.length} proceso${procesos.length !== 1 ? 's' : ''}`;
            contenido.appendChild(titulo);

            // Sub-grid de tarjetas
            const subGrid = document.createElement('div');
            subGrid.className = 'ps-grid';
            subGrid.setAttribute('role', 'list');
            procesos.forEach(p => subGrid.appendChild(crearTarjeta(p)));
            contenido.appendChild(subGrid);

            grupo.appendChild(nodo);
            grupo.appendChild(contenido);
            root.appendChild(grupo);
        }

        grid.innerHTML = '';
        grid.appendChild(root);
    }

    function crearTarjeta(p) {
        const el = document.createElement('app-proceso-card');
        el.setAttribute('role', 'listitem');
        el.proceso = p;
        return el;
    }

    /* ══════════════════════════════════════════════════
       FILTRO POR AÑO
    ══════════════════════════════════════════════════ */
    const filtrosAnioEl = document.getElementById('ps-filtros-anio');

    function generarFiltrosAnio(todos) {
        // Años únicos en orden descendente
        const anios = [...new Set(todos.map(p => p.anio))]
            .filter(a => a && a !== '—')
            .sort((a, b) => Number(b) - Number(a));

        if (anios.length <= 1) return; // No vale la pena mostrar filtros con 0 o 1 año

        filtrosAnioEl.style.display = 'block';
        filtrosAnioEl.innerHTML = '';

        const wrap = document.createElement('div');
        wrap.className = 'ps-filtros-wrap';

        const lbl = document.createElement('span');
        lbl.className = 'ps-filtros-label';
        lbl.textContent = 'Año:';
        wrap.appendChild(lbl);

        // Botón "Todos"
        const btnTodos = crearBtnFiltro('Todos', null);
        btnTodos.classList.add('activo');
        wrap.appendChild(btnTodos);

        // Un botón por cada año
        anios.forEach(anio => wrap.appendChild(crearBtnFiltro(String(anio), anio)));

        filtrosAnioEl.appendChild(wrap);
    }

    function crearBtnFiltro(label, valor) {
        const btn = document.createElement('button');
        btn.className = 'ps-filtro-btn';
        btn.textContent = label;
        btn.addEventListener('click', () => {
            _anioActivo = valor;
            // Actualizar estado visual de todos los botones
            filtrosAnioEl.querySelectorAll('.ps-filtro-btn')
                .forEach(b => b.classList.remove('activo'));
            btn.classList.add('activo');
            aplicarFiltros();
        });
        return btn;
    }

    /* ── Combina filtro texto (backend) + filtro año (cliente) y renderiza ── */
    async function aplicarFiltros() {
        const q = buscador.value.trim();
        let base;
        if (q) {
            if (_abortController) _abortController.abort();
            _abortController = new AbortController();
            try {
                const url = `${BASE}pruebas_admision?first=0&max=200&buscar=${encodeURIComponent(q)}`;
                const pruebas = await fetch(url, { signal: _abortController.signal })
                    .then(r => r.ok ? r.json() : Promise.reject(`HTTP ${r.status}`));
                base = ensamblar(pruebas, _turnosBrutos, _dispsBrutos);
            } catch (e) {
                if (e?.name === 'AbortError') return;
                base = [];
            }
        } else {
            base = _todos;
        }
        const resultado = _anioActivo !== null
            ? base.filter(p => p.anio == _anioActivo)
            : base;
        renderizar(resultado);
    }

    /* ── Agrupa lista por año en un Map ordenado desc ── */
    function agruparPorAnio(lista) {
        const mapa = new Map();
        // Ordenar desc por año antes de agrupar
        const ordenada = [...lista].sort((a, b) => Number(b.anio) - Number(a.anio));
        for (const p of ordenada) {
            const k = p.anio ?? '—';
            if (!mapa.has(k)) mapa.set(k, []);
            mapa.get(k).push(p);
        }
        return mapa; // Map<año, proceso[]> en orden desc
    }

    /* ══════════════════════════════════════════════════
       BÚSQUEDA — fetch al backend con debounce 300 ms
    ══════════════════════════════════════════════════ */
    let _debounce;
    buscador.addEventListener('input', () => {
        clearTimeout(_debounce);
        _debounce = setTimeout(aplicarFiltros, 300);
    });

    /* ══════════════════════════════════════════════════
       UTILIDADES
    ══════════════════════════════════════════════════ */
    function actualizarContador(n) {
        contador.innerHTML = n > 0
            ? `<strong>${n}</strong> proceso${n !== 1 ? 's' : ''} encontrado${n !== 1 ? 's' : ''}`
            : '';
    }

    function mostrarSkeleton() {
        grid.innerHTML = Array.from({length: 4}, () => `
            <div style="background:var(--color-surface); border:1px solid var(--color-border);
                        border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);
                        overflow:hidden; display:flex; flex-direction:column;"
                 aria-hidden="true">
                <div style="background:linear-gradient(135deg,#1e2e5c,#1E3A8A);
                            padding:var(--space-md) var(--space-lg);">
                    <div style="display:flex; justify-content:space-between;
                                margin-bottom:var(--space-sm);">
                        <div class="ps-skeleton-rect" style="height:20px; width:72px;"></div>
                        <div class="ps-skeleton-rect" style="height:20px; width:44px;"></div>
                    </div>
                    <div class="ps-skeleton-rect" style="height:15px; width:75%; opacity:.5;"></div>
                </div>
                <div style="padding:var(--space-lg); flex:1; display:flex;
                            flex-direction:column; gap:var(--space-md);">
                    <div style="display:grid; grid-template-columns:1fr 1fr;
                                gap:var(--space-md) var(--space-lg);">
                        ${Array.from({length: 4}, () => `
                        <div style="display:flex; flex-direction:column; gap:3px;">
                            <div class="ps-skeleton-rect"
                                 style="height:10px; width:60%; margin-bottom:5px;"></div>
                            <div class="ps-skeleton-rect" style="height:14px; width:85%;"></div>
                        </div>`).join('')}
                        <div style="grid-column:1/-1; display:flex; flex-direction:column; gap:3px;">
                            <div class="ps-skeleton-rect"
                                 style="height:10px; width:35%; margin-bottom:6px;"></div>
                            <div class="ps-skeleton-rect"
                                 style="height:22px; width:48%; border-radius:9999px;"></div>
                        </div>
                    </div>
                    <div class="ps-skeleton-rect"
                         style="height:38px; width:100%; border-radius:var(--radius-md);
                                margin-top:var(--space-sm);"></div>
                </div>
            </div>`).join('');
    }

    function mostrarError(msg) {
        grid.innerHTML = `
            <div class="ps-empty">
                <div class="ps-empty-icon">⚠️</div>
                <p style="font-size:1rem;font-weight:500;color:var(--color-danger);">
                    ${msg}
                </p>
            </div>`;
    }

    /* ── Arranque ── */
    cargarDatos();
</script>
