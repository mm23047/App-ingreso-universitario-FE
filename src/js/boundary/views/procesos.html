<!-- ============================================================
     VISTA: PROCESOS DE INGRESO  (#/procesos)

     Fuentes de datos — sin modificar backend:
     ┌─────────────────────────────────────────────────────────────┐
     │ 1. GET /v1/pruebas_admision?first=0&max=200                 │
     │    → [{ idPruebaAdmision, nombrePrueba, anio, activa }]     │
     │                                                             │
     │ 2. GET /v1/turnos                                           │
     │    → [{ idTurnoExamen, nombreTurno, fecha,                  │
     │         horaInicio, horaFin,                                │
     │         pruebaAdmision: { idPruebaAdmision } }]             │
     │                                                             │
     │ 3. GET /v1/aulas_turnos/disponibilidad                      │
     │    → [{ idDisponibilidadAulaTurno: { idAula, idTurno },     │
     │         aula: { nombreSede, departamento, municipio, ... },  │
     │         turnoExamen: { idTurnoExamen, ... } }]              │
     └─────────────────────────────────────────────────────────────┘

     Join cliente:
       prueba → turnos  (por turno.pruebaAdmision.idPruebaAdmision)
       turno  → sedes   (por disponibilidad.turnoExamen.idTurnoExamen)

     Objeto ensamblado final:
     {
       idPruebaAdmision, nombrePrueba, anio, activa,
       fechaInicio: string|null,   // min(turno.fecha)
       fechaFin:    string|null,   // max(turno.fecha)
       jornadas:    string[],      // nombreTurno únicos
       horarios:    string[],      // "HH:MM – HH:MM" únicos
       sedes:       string[]       // nombreSede únicos
     }

     Campos sin endpoint disponible (ocultos):
       - Tipo de prueba     (no existe en ninguno de los 3 endpoints)
       - Descripción        (PruebaAdmision no tiene campo descripción)
       - Cupos disponibles  (requiere GET /cupos — fuera de alcance)
     ============================================================ -->

<!-- ── Encabezado ── -->
<h2 class="mb-xs">Procesos de ingreso</h2>

<!-- ── Banner de datos parciales ── -->
<div id="ps-banner" class="ps-banner-parcial" role="status"></div>

<!-- ── Barra de búsqueda + contador ── -->
<div class="toolbar mb-lg">
    <div class="ps-buscador-wrap">
        <span class="ps-buscador-icon" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.35-4.35"/>
            </svg>
        </span>
        <input type="search" id="ps-buscador" class="ps-buscador"
               placeholder="Buscar por nombre del proceso…"
               autocomplete="off" aria-label="Buscar proceso">
    </div>
    <span id="ps-contador" class="ps-contador" aria-live="polite"></span>
</div>

<!-- ── Filtros por año (se genera dinámicamente) ── -->
<div id="ps-filtros-anio" style="display:none;"></div>

<!-- ── Timeline cronológica (se genera dinámicamente) ── -->
<div id="ps-grid"></div>

<script type="module">
    import ProcesosController from './js/control/procesos_controller.js';
    import { store }          from './js/infra/app_state.js';
    import { navigate }       from './js/infra/router.js';
    import './js/boundary/components/proceso-card.js';

    const ctrl      = new ProcesosController();
    const grid      = document.getElementById('ps-grid');
    const buscador  = document.getElementById('ps-buscador');
    const contador  = document.getElementById('ps-contador');
    const banner    = document.getElementById('ps-banner');

    let _todos      = [];
    let _anioActivo = null;

    grid.addEventListener('proceso-seleccionado', (e) => {
        const p = e.detail.proceso;
        store.prueba = {
            idPruebaAdmision: p.idPruebaAdmision,
            nombrePrueba:     p.nombrePrueba,
            anio:             p.anio,
            activa:           p.activa,
        };
        navigate('/areas');
    });

    /* ══════════════════════════════════════════════════
       CARGA
    ══════════════════════════════════════════════════ */
    async function cargarDatos() {
        mostrarSkeleton();
        try {
            const { procesos, avisos } = await ctrl.cargar();
            if (avisos.length) {
                banner.style.display = 'block';
                banner.textContent = `Datos incompletos: no se pudieron cargar ${avisos.join(' y ')}.`;
            }
            _todos = procesos;
            generarFiltrosAnio(_todos);
            renderizar(_todos);
        } catch (err) {
            mostrarError(err.message);
        }
    }

    /* ══════════════════════════════════════════════════
       RENDER
    ══════════════════════════════════════════════════ */
    function renderizar(lista) {
        actualizarContador(lista.length);

        if (!lista.length) {
            grid.innerHTML = `
                <div class="ps-empty">
                    <div class="ps-empty-icon"></div>
                    <p class="ps-empty-title">No se encontraron procesos.</p>
                    <p class="ps-empty-desc">
                        Intenta con otro término de búsqueda o cambia el filtro de año.
                    </p>
                </div>`;
            return;
        }

        const grupos = ctrl.agruparPorAnio(lista);

        const root = document.createElement('div');
        root.className = 'ps-tl-root';

        const linea = document.createElement('div');
        linea.className = 'ps-tl-linea';
        linea.setAttribute('aria-hidden', 'true');
        root.appendChild(linea);

        for (const [anio, procesos] of grupos) {
            const grupo = document.createElement('div');
            grupo.className = 'ps-tl-grupo';

            const nodo = document.createElement('div');
            nodo.className = 'ps-tl-nodo';
            nodo.setAttribute('aria-hidden', 'true');
            nodo.textContent = anio;

            const contenido = document.createElement('div');
            contenido.className = 'ps-tl-contenido';

            const titulo = document.createElement('div');
            titulo.className = 'ps-tl-anio-titulo';
            titulo.textContent = `Año académico ${anio} · ${procesos.length} proceso${procesos.length !== 1 ? 's' : ''}`;
            contenido.appendChild(titulo);

            const subGrid = document.createElement('div');
            subGrid.className = 'ps-grid';
            subGrid.setAttribute('role', 'list');
            procesos.forEach(p => subGrid.appendChild(crearTarjeta(p)));
            contenido.appendChild(subGrid);

            grupo.appendChild(nodo);
            grupo.appendChild(contenido);
            root.appendChild(grupo);
        }

        grid.innerHTML = '';
        grid.appendChild(root);
    }

    function crearTarjeta(p) {
        const el = document.createElement('app-proceso-card');
        el.setAttribute('role', 'listitem');
        el.proceso = p;
        return el;
    }

    /* ══════════════════════════════════════════════════
       FILTRO POR AÑO
    ══════════════════════════════════════════════════ */
    const filtrosAnioEl = document.getElementById('ps-filtros-anio');

    function generarFiltrosAnio(todos) {
        const anios = [...new Set(todos.map(p => p.anio))]
            .filter(a => a && a !== '—')
            .sort((a, b) => Number(b) - Number(a));

        if (anios.length <= 1) return;

        filtrosAnioEl.style.display = 'block';
        filtrosAnioEl.innerHTML = '';

        const wrap = document.createElement('div');
        wrap.className = 'ps-filtros-wrap';

        const lbl = document.createElement('span');
        lbl.className = 'ps-filtros-label';
        lbl.textContent = 'Año:';
        wrap.appendChild(lbl);

        const btnTodos = crearBtnFiltro('Todos', null);
        btnTodos.classList.add('activo');
        wrap.appendChild(btnTodos);

        anios.forEach(anio => wrap.appendChild(crearBtnFiltro(String(anio), anio)));
        filtrosAnioEl.appendChild(wrap);
    }

    function crearBtnFiltro(label, valor) {
        const btn = document.createElement('button');
        btn.className = 'ps-filtro-btn';
        btn.textContent = label;
        btn.addEventListener('click', () => {
            _anioActivo = valor;
            filtrosAnioEl.querySelectorAll('.ps-filtro-btn')
                .forEach(b => b.classList.remove('activo'));
            btn.classList.add('activo');
            aplicarFiltros();
        });
        return btn;
    }

    /* ══════════════════════════════════════════════════
       BÚSQUEDA — debounce 300 ms
    ══════════════════════════════════════════════════ */
    async function aplicarFiltros() {
        const q = buscador.value.trim();
        let base;
        if (q) {
            try {
                base = await ctrl.buscar(q);
            } catch (e) {
                if (e?.name === 'AbortError') return;
                base = [];
            }
        } else {
            base = _todos;
        }
        const resultado = _anioActivo !== null
            ? base.filter(p => p.anio == _anioActivo)
            : base;
        renderizar(resultado);
    }

    let _debounce;
    buscador.addEventListener('input', () => {
        clearTimeout(_debounce);
        _debounce = setTimeout(aplicarFiltros, 300);
    });

    /* ══════════════════════════════════════════════════
       UTILIDADES
    ══════════════════════════════════════════════════ */
    function actualizarContador(n) {
        contador.innerHTML = n > 0
            ? `<strong>${n}</strong> proceso${n !== 1 ? 's' : ''} encontrado${n !== 1 ? 's' : ''}`
            : '';
    }

    function mostrarSkeleton() {
        grid.innerHTML = Array.from({length: 4}, () => `
            <div class="ps-skeleton-card" aria-hidden="true">
                <div class="ps-skeleton-head">
                    <div class="ps-skeleton-head-row">
                        <div class="ps-skeleton-rect" style="height:20px; width:72px;"></div>
                        <div class="ps-skeleton-rect" style="height:20px; width:44px;"></div>
                    </div>
                    <div class="ps-skeleton-rect" style="height:15px; width:75%; opacity:.5;"></div>
                </div>
                <div class="ps-skeleton-body">
                    <div class="ps-skeleton-fields">
                        ${Array.from({length: 4}, () => `
                        <div class="ps-skeleton-field">
                            <div class="ps-skeleton-rect" style="height:10px; width:60%; margin-bottom:5px;"></div>
                            <div class="ps-skeleton-rect" style="height:14px; width:85%;"></div>
                        </div>`).join('')}
                        <div class="ps-skeleton-field-full">
                            <div class="ps-skeleton-rect" style="height:10px; width:35%; margin-bottom:6px;"></div>
                            <div class="ps-skeleton-rect" style="height:22px; width:48%; border-radius:9999px;"></div>
                        </div>
                    </div>
                    <div class="ps-skeleton-rect ps-skeleton-btn"></div>
                </div>
            </div>`).join('');
    }

    function mostrarError(msg) {
        grid.innerHTML = `
            <div class="ps-empty">
                <div class="ps-empty-icon"></div>
                <p class="ps-empty-title text-danger">${msg}</p>
            </div>`;
    }

    /* ── Arranque ── */
    cargarDatos();
</script>
