# SonarQube - NuevoIngresoWeb (frontend)
# projectKey estable e independiente del artefacto/WAR del backend.
sonar.projectKey=nuevo-ingreso-web-frontend
sonar.projectName=NuevoIngresoWeb - Frontend
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.exclusions=src/test/**,src/img/**,src/demos/**,dist/**,coverage/**,node_modules/**

sonar.tests=src/test/js
sonar.test.inclusions=src/test/js/**/*.test.js
sonar.test.exclusions=src/test/js/lib/**

# Generado por `npm run coverage` (c8 -> lcov). Si no existe, Sonar analiza
# igual pero sin métricas de cobertura (no falla el análisis).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# NOTA cobertura: en CI solo corre src/test/js/unit/** (DAOs, controllers,
# infra) — ver .mocharc.json. Los tests de src/test/js/components/ (Web
# Components con Shadow DOM real) y las suites de integración
# (server-on/server-off) requieren navegador o backend real y siguen
# corriendo solo en el runner HTML existente (all_tests.html), no en este
# pipeline. Por eso la cobertura medida aquí cubre control/+entity/+infra,
# no boundary/components. Si el Quality Gate exige cobertura mínima sobre
# código nuevo y resulta demasiado agresivo con este alcance, la opción
# menos invasiva es bajar el umbral de "Coverage on New Code" del gate
# (o usar un gate propio para este proyecto) en vez de forzar tests
# artificiales solo para subir el número.
